<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Don't Go Broke!</title>
  <link rel="icon" href="tab-pic.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="click-sound">
  <source src="click sound.mp3" type="audio/mpeg">
</audio>

<script>
  // Grab the click audio element
  const clickSound = document.getElementById('click-sound');

  // Listen for a click ANYWHERE on the entire webpage
  document.body.addEventListener('click', function(event) {
    
    // 1. Always play the sound, no matter what they clicked
    clickSound.currentTime = 0; 
    clickSound.play();

    // 2. Check if the thing they clicked was a link (an <a> tag)
    // .closest('a') ensures it counts even if they click an image inside a link
    const targetLink = event.target.closest('a');

    // 3. If it WAS a link, do the delay trick so the sound has time to play
    if (targetLink && targetLink.href) {
      
      // Stop the instant page load
      event.preventDefault(); 
      
      // Get the URL
      const destination = targetLink.href;

      // Wait 300 milliseconds, then load the new page
      setTimeout(function() {
        window.location.href = destination;
      }, 300); 
    }
    
    // If it WASN'T a link, the code just naturally stops here, 
    // the sound plays, and they stay on the current page.
  });
</script>

<audio autoplay loop id="bg-music">
  <source src="Apple.mp3" type="audio/mpeg">
</audio>

<script>
  // This listens for the very first click anywhere on the page
  document.body.addEventListener('click', function() {
    var audio = document.getElementById("bg-music");
    // If the audio is paused (blocked by browser), this click will force it to play
    if (audio.paused) {
      audio.play();
    }
  }, { once: true }); // The 'once: true' ensures this only triggers on the first click
</script>

  <div class="animation-container">
    
    <video class="opening-video" autoplay muted playsinline>
      <source src="dark-bg.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <a href="leaderboard.html" class="overlay-button button-1"></a>
    <a href="game.html" class="overlay-button button-2"></a>
    <a href="/aboutUs.html" class="overlay-button button-3"></a>

  </div>

</body>
</html>
