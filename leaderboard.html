<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard</title>
  <link rel="icon" href="tab-pic.png" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #042e1b;
      color: #f0e6c8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app {
      width: 100%;
      max-width: 420px;
      padding: 1.5rem 1rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #title {
      font-size: 20px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #a08840;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    #leaderboard-container {
      background: #510c0c;
      border: 1px solid #4a3a18;
      border-radius: 12px;
      width: 280px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .score-entry {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #4a3a18;
      padding: 8px 0;
      font-size: 14px;
      color: #d0c090;
    }
    .score-entry:last-child {
      border-bottom: none;
    }
    .rank {
      color: #a08840;
      font-weight: bold;
    }

    /* Container to hold both buttons side by side */
    #button-group {
      display: flex;
      gap: 15px; /* Space between buttons */
      width: 280px;
      justify-content: center;
    }

    /* Shared style for both buttons */
    .nav-btn {
      padding: 10px 18px;
      border-radius: 20px;
      border: 1px solid #4a3a18;
      background: transparent;
      color: #a08840;
      font-size: 12px;
      font-family: Georgia, serif;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
      text-align: center;
      flex: 1; /* Makes both buttons equal width */
    }
    
    .nav-btn:hover {
      background: #2a1e08;
      color: #d0aa60;
    }
  </style>
</head>
<body>


<audio id="click-sound">
  <source src="click sound.mp3" type="audio/mpeg">
</audio>

<script>
  // Grab the click audio element
  const clickSound = document.getElementById('click-sound');

  // Listen for a click ANYWHERE on the entire webpage
  document.body.addEventListener('click', function(event) {
    
    // 1. Always play the sound, no matter what they clicked
    clickSound.currentTime = 0; 
    clickSound.play();

    // 2. Check if the thing they clicked was a link (an <a> tag)
    // .closest('a') ensures it counts even if they click an image inside a link
    const targetLink = event.target.closest('a');

    // 3. If it WAS a link, do the delay trick so the sound has time to play
    if (targetLink && targetLink.href) {
      
      // Stop the instant page load
      event.preventDefault(); 
      
      // Get the URL
      const destination = targetLink.href;

      // Wait 300 milliseconds, then load the new page
      setTimeout(function() {
        window.location.href = destination;
      }, 300); 
    }
    
    // If it WASN'T a link, the code just naturally stops here, 
    // the sound plays, and they stay on the current page.
  });
</script>

  <div id="app">
    <div id="title"> <b>LEADERBOARD</b> </div>

    <div id="leaderboard-container">
      <div id="score-list">
        </div>
    </div>

    <div id="button-group">
      <a href="homepage.html" class="nav-btn">Home</a>
      <a href="game.html" class="nav-btn">Go to Game</a>
      
    </div>
  </div>

  <script>
    const scores = JSON.parse(localStorage.getItem('dontGoBrokeScores')) || [];
    const scoreList = document.getElementById('score-list');

    if (scores.length === 0) {
      scoreList.innerHTML = '<div style="text-align: center; color: #8a7a50; font-size: 13px;">No reigns recorded yet.</div>';
    } else {
      scores.forEach((score, index) => {
        const entry = document.createElement('div');
        entry.className = 'score-entry';
        
        const rankDisplay = index === 0 ? '👑 1' : index + 1;

        entry.innerHTML = `
          <span class="rank">#${rankDisplay}</span>
          <span>${score.weeks} Weeks</span>
        `;
        scoreList.appendChild(entry);
      });
    }
  </script>
</body>
</html>
