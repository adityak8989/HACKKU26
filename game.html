<!DOCTYPE html>

<head>

  <style>

    /* =============================================
       RESET & BASE
    ============================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #042e1b;
      color: #f0e6c8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =============================================
       LAYOUT WRAPPER
    ============================================= */
    #app {
      width: 100%;
      max-width: 420px;
      padding: 1.5rem 1rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =============================================
       HEADER / TITLE
    ============================================= */
    #title {
      font-size: 20px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #a08840;
      margin-bottom: 1.5rem;
    }

    /* =============================================
       YEAR COUNTER
    ============================================= */
    #year-counter {
      font-size: 18px;
      color: #a08840;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
    }

    /* =============================================

    ============================================= */
    #stats {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-icon {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a08840;
      margin-bottom: 4px;
      font-family: Georgia, serif;
    }

    .stat-bar-bg {
      width: 100%;
      height: 5px;
      background: #2e2410;
      border-radius: 3px;
      overflow: hidden;
    }

    .stat-bar {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* Each stat bar has its own colour */
    .stat-bar.investments   { background: #8db87a; }
    .stat-bar.happiness   { background: #7aaad0; }
    .stat-bar.career     { background: #d07a7a; }
    .stat-bar.savings { background: #d4aa50; }

    .stat-val {
      font-size: 11px;
      margin-top: 3px;
      color: #a09070;
    }

    /* =============================================
       CHOICE LABELS (shown left / right of card)
    ============================================= */
    #choice-labels {
      display: flex;
      justify-content: space-between;
      width: 280px;
      margin-bottom: 0.75rem;
    }

    .choice-label {
      font-size: 11px;
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #3a2e18;
      color: #6a5a30;
      letter-spacing: 0.05em;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      font-family: Georgia, serif;
    }

    .choice-label.active-no {
      background: #3a1a1a;
      color: #d07a7a;
      border-color: #a04040;
    }

    .choice-label.active-yes {
      background: #1a3020;
      color: #8db87a;
      border-color: #508050;
    }

    /* =============================================
       CARD AREA  (the draggable card sits here)
    ============================================= */
    #card-area {
      position: relative;
      width: 280px;
      height: 340px;
      margin-bottom: 1.25rem;
    }

    #card {
      position: absolute;
      width: 100%;
      height: 100%;

      /* Parchment look */
      background: #510c0c;
      border: 1px solid #4a3a18;
      border-radius: 12px;
      padding: 1.75rem 1.5rem 1.5rem;

      display: flex;
      flex-direction: column;
      align-items: center;

      cursor: grab;
      transition: transform 0.15s ease, opacity 0.15s ease;
      will-change: transform;
    }

    #card.dragging {
      cursor: grabbing;
      transition: none; /* disable transition while dragging for responsiveness */
    }

    /* Portrait circle */
    .card-portrait {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #1a1208;
      border: 1px solid #4a3a18;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 0.75rem;
    }

    .card-name {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #a08840;
      margin-bottom: 0.75rem;
    }

    .card-text {
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
      color: #d0c090;
      flex: 1;
    }

    /* Subtle hint shown on first card */
    #swipe-hint {
      font-size: 11px;
      margin-top: 0.75rem;
      color: #5a4a28;
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.4s;
    }

    #swipe-hint.visible {
      opacity: 1;
    }

    /* =============================================
       DEATH / GAME OVER SCREEN
    ============================================= */
    #death-screen {
      display: none;          /* hidden until triggered */
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1rem;
      min-height: 460px;
      justify-content: center;
    }

    #death-skull {
      font-size: 52px;
      margin-bottom: 1rem;
    }

    #death-title {
      font-size: 20px;
      font-weight: normal;
      margin-bottom: 0.75rem;
      color: #f0e6c8;
    }

    #death-reason {
      font-size: 14px;
      color: #8a7a50;
      line-height: 1.8;
      max-width: 280px;
      margin-bottom: 2rem;
    }

    #restart-btn {
      padding: 10px 28px;
      border-radius: 20px;
      border: 1px solid #4a3a18;
      background: transparent;
      color: #a08840;
      font-size: 13px;
      font-family: Georgia, serif;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    #restart-btn:hover {
      background: #2a1e08;
      color: #d0aa60;
    }

  </style>
</head>
<body>

  <!-- =============================================
       MAIN GAME VIEW
  ============================================= -->
  <div id="app">

    <div id="title"> <b>DON'T GO BROKE!</b> </div>

    <div id="year-counter">Year 1</div>

    <!-- STAT BARS -->
    <div id="stats">
      <div class="stat">
        <div class="stat-icon">💸</div>
        <div class="stat-label">Investments</div>
        <div class="stat-bar-bg">
          <div class="stat-bar investments" id="bar-investments" style="width: 50%"></div>
        </div>
        <div class="stat-val" id="val-investments">50</div>
      </div>

      <div class="stat">
        <div class="stat-icon">😊</div>
        <div class="stat-label">Happiness</div>
        <div class="stat-bar-bg">
          <div class="stat-bar happiness" id="bar-happiness" style="width: 50%"></div>
        </div>
        <div class="stat-val" id="val-happiness">50</div>
      </div>

      <div class="stat">
        <div class="stat-icon">🏢</div>
        <div class="stat-label">career</div>
        <div class="stat-bar-bg">
          <div class="stat-bar career" id="bar-career" style="width: 50%"></div>
        </div>
        <div class="stat-val" id="val-career">50</div>
      </div>

      <div class="stat">
        <div class="stat-icon">🤑</div>
        <div class="stat-label">Savings</div>
        <div class="stat-bar-bg">
          <div class="stat-bar savings" id="bar-savings" style="width: 50%"></div>
        </div>
        <div class="stat-val" id="val-savings">50</div>
      </div>
    </div>

    <!-- LEFT / RIGHT CHOICE LABELS -->
    <div id="choice-labels">
      <span class="choice-label" id="lbl-no">✕ No</span>
      <span class="choice-label" id="lbl-yes">✓ Yes</span>
    </div>

    <!-- THE CARD -->
    <div id="card-area">
      <div id="card">
        <div class="card-portrait" id="card-portrait"></div>
        <div class="card-name"     id="card-name"></div>
        <div class="card-text"     id="card-text"></div>
        <div id="swipe-hint">← swipe to decide →</div>
      </div>
    </div>

  </div><!-- /#app -->

  <!-- =============================================
       DEATH SCREEN  (hidden initially)
  ============================================= -->
  <div id="death-screen">
    <div id="death-skull">💀</div>
    <h2 id="death-title">You're Dead</h2>
    <p  id="death-reason"></p>
    <button id="restart-btn">Start Over</button>
  </div>


  <!-- =============================================
       JAVASCRIPT
  ============================================= -->
  <script>

    // -----------------------------------------------
    // 1. CARD DATA
    //    Each card has: name, portrait emoji, flavour
    //    text, and two choices (yes / no).
    //    Each choice has an effects object that adds
    //    or subtracts from the four stats.
    // -----------------------------------------------
    const cards = [
      {
        name: "Businessman",
        portrait: "👨‍⚖️",
        text: "Do you want to invest in a new business venture?",
        no:  { label: "Refuse",  effects: { investments: -15, happiness:   5, career:  0, savings:  10 } },
        yes: { label: "Accept", effects: { investments:  20, happiness:  0, career:  5, savings: -10 } }
      },
      {
        name: "Information",
        portrait: "📓",
        text: "Saving your money is wise, but did you know that investing can grow your wealth faster",
        no:  { label: "Wow", effects: { investments:  0, happiness:  0, career: 0, savings:  0 } },
        yes: { label: "Wow",    effects: {investments:  0, happiness:  0, career: 0, savings:  0 } }
      },
      {
        name: "Information",
        portrait: "📓",
        text: "50/30/20 Rule: 50% of your income should go to needs, 30% to wants, and 20% to savings/investments",
        no:  { label: "Wow", effects: { investments:  0, happiness:  0, career: 0, savings:  0 } },
        yes: { label: "Wow",    effects: {investments:  0, happiness:  0, career: 0, savings:  0 } }
      },
      {
        name: "Nigerian Prince",
        portrait: "🤴🏽",
        text: "I'm a Nigerian prince and I need your help! Will you transfer me $10,000?",

        no:  { label: "YES", effects: { investments:  0, happiness:  -5, career: -10, savings:  -10 } },
        yes: { label: "This seems like a scam!",    effects: { investments:  0, happiness: 5, career:  0, savings: 10 } }
      },
    
      {
        name: "Homeless Man",
        portrait: "👴",
        text: "Spare some change?",
        no:  { label: "No",   effects: { investments:  0, happiness: -20, career:  0, savings:  15 } },
        yes: { label: "Spare some", effects: { investments:  0, happiness:  20, career:  0, savings: -15 } }
      },
      {
        name: "School",
        portrait: "🏫",
        text: "We're taking money out of your paycheck for taxes",
        no:  { label: "What?", effects: { investments:  0, happiness:  -10, career:  0, savings:  -10 } },
        yes: { label: "What?",  effects: { investments:  0, happiness: -10, career:  0, savings:  -10 } }
      },
      {
        name: "Green Gummy Bear",
        portrait: "🐻",
        text: "I'm a green gummy bear and I'm going to eat you",
        no:  { label: "Ok!!!",    effects: { investments:  0, happiness:  -90, career: 0, savings:   0 } },
        yes: { label: "Run Away",      effects: { investments: 0, happiness: 5, career: 0, savings: 0 } }
      },
      {
        name: "Mr. Stock Market",
        portrait: "📈",
        text: "The Stock Market is going up do you want to invest?",
        no:  { label: "No", effects: { investments:  -20, happiness: 0, career: 0, savings:  10 } },
        yes: { label: "Yes",  effects: { investments:  20, happiness:  0, career:  0, savings: -10 } }
      },
      {
        name: "Funny Clown Guy",
        portrait: "🤡",
        text: "Do you want to see an awesome magic trick that will blow your mind for 10 dollars?",
        no:  { label: "No",  effects: { investments:  0, happiness: -10, career:  0, savings:  10 } },
        yes: { label: "Yes", effects: { investments: 0, happiness:  20, career:  5, savings: -20 } }
      },
      {
        name: "Umbrella Corp(Evil)",
        portrait: "☂️",
        text: "Do you want to invest in bio engineering new life forms?",
        no:  { label: "No",  effects: { investments:  10, happiness:  5, career: 5, savings:   5 } },
        yes: { label: "Yes",   effects: { investments: -10, happiness: -10, career:  10, savings:  -5 } }
      },
      {
        name: "Car Crash",
        portrait: "🏎️",
        text: "You got in a car crash! Do you want to sue the other driver for compensation?",
        no:  { label: "No need",  effects: { investments:  -5, happiness:  5, career:  0, savings:  -10 } },
        yes: { label: "I'M SUEING THEM",  effects: { investments: 10, happiness:  0, career:  0, savings: 10 } }
      },
      {
        name: "Movies",
        portrait: "🎥",
        text: "You're invited to a movie premiere. Will you go?",
        no:  { label: "Stay home",  effects: { investments: 0, happiness:  -10, career:   0, savings:  10 } },
        yes: { label: "Go to the premiere", effects: { investments:  0, happiness: 10, career: 0, savings: -10 } }
      }
    ];

    // -----------------------------------------------
    // 2. DEATH MESSAGES
    //    Keyed by stat name and whether it hit 0 (low)
    //    or 100 (high).
    // -----------------------------------------------
    const deathReasons = {
      investments: {
        low:  "You've depleted your investments. Without capital, you've lost all support.",
        high: "Too invested, perhaps? But investment can be a burden too."
      },
      happiness: {
        low:  "You've become so unhappy that you cannot continue.",
        high: "Too happy, perhaps? But happiness can be a burden too."
      },
      career: {
        low:  "Jobless and hopeless, you've lost all purpose.",
        high: "Too successful, perhaps? But success can be a burden too."
      },
      savings: {
        low:  "You've run out of money. Unable to pay your bills, you've lost all resources.",
        high: "Too wealthy, perhaps? But wealth can be a burden too."
      }
    };

    // -----------------------------------------------
    // 3. GAME STATE
    // -----------------------------------------------
    let stats = { investments: 50, happiness: 50, career: 50, savings: 50 };
    let year  = 1;
    let cardQueue   = [];
    let hintShown   = false;
    let currentCard = null;

    // -----------------------------------------------
    // 4. UTILITY: Fisher-Yates shuffle
    // -----------------------------------------------
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [ array[i], array[j] ] = [ array[j], array[i] ];
      }
      return array;
    }

    function refillQueue() {
      cardQueue = shuffle([...cards]); // spread so we don't mutate original
    }

    // -----------------------------------------------
    // 5. DRAW NEXT CARD
    // -----------------------------------------------
    function nextCard() {
      if (cardQueue.length === 0) refillQueue();

      currentCard = cardQueue.pop();

      // Populate the card DOM elements
      document.getElementById('card-portrait').textContent = currentCard.portrait;
      document.getElementById('card-name').textContent     = currentCard.name;
      document.getElementById('card-text').textContent     = currentCard.text;
      document.getElementById('lbl-no').textContent        = '✕ ' + currentCard.no.label;
      document.getElementById('lbl-yes').textContent       = '✓ ' + currentCard.yes.label;

      // Reset labels to default style
      document.getElementById('lbl-no').className  = 'choice-label';
      document.getElementById('lbl-yes').className = 'choice-label';

      resetCardPosition();

      // Show hint on first card only
      if (!hintShown) {
        document.getElementById('swipe-hint').classList.add('visible');
      }
    }

    function resetCardPosition() {
      const card = document.getElementById('card');
      card.style.transform  = '';
      card.style.opacity    = '';
      card.style.transition = '';
    }

    // -----------------------------------------------
    // 6. UPDATE THE STAT BARS IN THE DOM
    // -----------------------------------------------
    function updateStats() {
      for (const [key, value] of Object.entries(stats)) {
        const clamped = Math.max(0, Math.min(100, value));
        document.getElementById('bar-' + key).style.width = clamped + '%';
        document.getElementById('val-' + key).textContent  = clamped;
      }
      document.getElementById('year-counter').textContent = 'Week ' + year;
    }

    // -----------------------------------------------
    // 7. APPLY A CHOICE (called after a confirmed swipe)
    //    choice = 'yes' or 'no'
    // -----------------------------------------------
    function applyChoice(choice) {
      hintShown = true;
      document.getElementById('swipe-hint').classList.remove('visible');

      // Add each effect to the corresponding stat
      const effects = currentCard[choice].effects;
      for (const [key, delta] of Object.entries(effects)) {
        stats[key] = (stats[key] || 0) + delta;
      }

      year++;
      updateStats();
      checkDeath();

      // Only draw next card if the game is still running
      if (document.getElementById('app').style.display !== 'none') {
        nextCard();
      }
    }

    // -----------------------------------------------
    // 8. CHECK IF ANY STAT HIT 0 OR 100
    // -----------------------------------------------
    function checkDeath() {
      for (const stat of ['investments', 'happiness', 'career', 'savings']) {
        if (stats[stat] <= 0)   { showDeath(stat, 'low');  return; }
        if (stats[stat] >= 100) { showDeath(stat, 'high'); return; }
      }
    }

    // -----------------------------------------------
    // 9. SHOW DEATH SCREEN
    // -----------------------------------------------
    function showDeath(stat, type) {
      document.getElementById('app').style.display          = 'none';
      document.getElementById('death-screen').style.display = 'flex';
      document.getElementById('death-title').textContent    = 'You lasted ' + year + ' weeks';
      document.getElementById('death-reason').textContent   = deathReasons[stat][type];
    }

    // -----------------------------------------------
    // 10. RESTART BUTTON
    // -----------------------------------------------
    document.getElementById('restart-btn').addEventListener('click', () => {
      stats     = { investments: 50, happiness: 50, career: 50, savings: 50 };
      year      = 1;
      hintShown = false;

      refillQueue();
      updateStats();

      document.getElementById('death-screen').style.display = 'none';
      document.getElementById('app').style.display          = 'flex';

      nextCard();
    });

    // -----------------------------------------------
    // 11. DRAG / SWIPE LOGIC
    //
    //   Three phases:
    //   - onStart : record starting X, mark dragging
    //   - onMove  : translate the card, tilt it, update labels
    //   - onEnd   : if moved far enough → commit choice;
    //               otherwise snap back
    // -----------------------------------------------
    const cardEl = document.getElementById('card');
    const THRESHOLD = 90; // pixels needed to commit a swipe

    let startX   = 0;
    let currentX = 0;
    let isDragging = false;

    function onStart(x) {
      startX     = x;
      isDragging = true;
      cardEl.classList.add('dragging');
    }

    function onMove(x) {
      if (!isDragging) return;

      currentX = x - startX;

      // Rotate slightly as you drag (max ~8°)
      const rotation = currentX * 0.08;
      const opacity  = Math.max(0.3, 1 - Math.abs(currentX) / 300);

      cardEl.style.transform = `translateX(${currentX}px) rotate(${rotation}deg)`;
      cardEl.style.opacity   = opacity;

      // Highlight the matching choice label
      const noLabel  = document.getElementById('lbl-no');
      const yesLabel = document.getElementById('lbl-yes');

      if (currentX < -40) {
        noLabel.className  = 'choice-label active-no';
        yesLabel.className = 'choice-label';
      } else if (currentX > 40) {
        yesLabel.className = 'choice-label active-yes';
        noLabel.className  = 'choice-label';
      } else {
        noLabel.className  = 'choice-label';
        yesLabel.className = 'choice-label';
      }
    }

    function onEnd() {
      if (!isDragging) return;
      isDragging = false;
      cardEl.classList.remove('dragging');

      if (currentX < -THRESHOLD) {
        // --- Swiped LEFT → No ---
        cardEl.style.transition = 'transform 0.25s ease, opacity 0.25s ease';
        cardEl.style.transform  = 'translateX(-500px) rotate(-20deg)';
        cardEl.style.opacity    = '0';
        setTimeout(() => applyChoice('no'), 250);

      } else if (currentX > THRESHOLD) {
        // --- Swiped RIGHT → Yes ---
        cardEl.style.transition = 'transform 0.25s ease, opacity 0.25s ease';
        cardEl.style.transform  = 'translateX(500px) rotate(20deg)';
        cardEl.style.opacity    = '0';
        setTimeout(() => applyChoice('yes'), 250);

      } else {
        // --- Not far enough → snap back ---
        resetCardPosition();
        document.getElementById('lbl-no').className  = 'choice-label';
        document.getElementById('lbl-yes').className = 'choice-label';
      }

      currentX = 0;
    }

    // Mouse events
    cardEl.addEventListener('mousedown', (e) => { onStart(e.clientX); e.preventDefault(); });
    window.addEventListener('mousemove', (e) => { if (isDragging) onMove(e.clientX); });
    window.addEventListener('mouseup',   onEnd);

    // Touch events (mobile)
    cardEl.addEventListener('touchstart', (e) => { onStart(e.touches[0].clientX); }, { passive: true });
    window.addEventListener('touchmove',  (e) => { if (isDragging) onMove(e.touches[0].clientX); }, { passive: true });
    window.addEventListener('touchend',   onEnd);

    // -----------------------------------------------
    // 12. KICK THINGS OFF
    // -----------------------------------------------
    refillQueue();
    nextCard();
    updateStats();

  </script>
</body>
</html>
